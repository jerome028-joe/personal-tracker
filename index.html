<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Expense Tracker</title><style>
:root{--navy:#152b59;--blue:#294d99;--green:#0fa77e;--bg:#f5f7fb;--surface:#fff;--ink:#1c2941;--muted:#6d7890;--line:#e4e9f2;--red:#db4861}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}.app{display:flex;min-height:100vh}.side{width:240px;background:linear-gradient(180deg,#182f63,#102348);color:white;padding:28px 16px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{font-size:21px;font-weight:800;padding:0 12px 28px;line-height:1.4}.brand span{color:#40dfb0}.nav{display:block;width:100%;background:none;border:0;color:#d6def2;text-align:left;padding:13px 15px;margin:4px 0;border-radius:11px;cursor:pointer;font-size:14px}.nav:hover,.nav.active{background:#ffffff1c;color:white}.main{padding:32px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px;flex-wrap:wrap}h1{margin:0;font-size:28px}h2{font-size:19px;margin:0 0 17px}p{color:var(--muted)}.sub{margin:8px 0 0;font-size:14px}.btn{background:var(--green);color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;font-weight:700}.btn:hover{filter:brightness(.95)}.btn.secondary{background:#eaf0fb;color:var(--blue)}.btn.danger{background:#ffe7ea;color:#ad2a45}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:22px;box-shadow:0 5px 18px #1c36600a}.card .label{color:var(--muted);font-size:13px}.card .value{font-size:27px;font-weight:800;margin-top:12px}.card:nth-child(2) .value{color:var(--red)}.card:nth-child(3) .value{color:var(--green)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.wide{grid-column:1/-1}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}input,select,textarea{background:#fff;border:1px solid #d7deeb;border-radius:9px;padding:11px 12px;color:var(--ink);font:inherit;max-width:100%}input:focus,select:focus{outline:2px solid #91d9c4}label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}.field{margin-bottom:16px}.field input,.field select,.field textarea{width:100%}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgrid .field{margin:0}.formactions{margin-top:20px;display:flex;gap:10px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;border-bottom:1px solid var(--line);padding:13px 10px}td{padding:14px 10px;border-bottom:1px solid var(--line)}.actions{display:flex;gap:6px}.mini{padding:7px 9px;font-size:12px}.pill{border-radius:25px;background:#eaf4ef;color:#087e60;padding:5px 9px;font-size:12px;font-weight:700}.empty{text-align:center;padding:35px;color:var(--muted)}.progress{height:12px;background:#e9edf4;border-radius:20px;overflow:hidden}.progress div{height:100%;background:var(--green);transition:width .2s}.barrow{display:grid;grid-template-columns:105px 1fr 95px;align-items:center;gap:12px;margin:16px 0;font-size:13px}.barbg{height:12px;background:#e9edf4;border-radius:8px;overflow:hidden}.barfill{height:100%;border-radius:8px}.donut{width:190px;height:190px;border-radius:50%;position:relative;flex-shrink:0}.donut:after{content:'';position:absolute;inset:36px;background:white;border-radius:50%}.chartarea{display:flex;gap:30px;align-items:center;flex-wrap:wrap}.legend{display:grid;gap:11px;flex:1;min-width:190px}.legendrow{display:flex;justify-content:space-between;gap:10px;font-size:13px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}.notice{padding:12px 15px;border-radius:10px;background:#e7f7f0;color:#0b805f;margin-top:16px}.notice.warn{background:#fff1d9;color:#92600c}.notice.danger{background:#ffebee;color:#a72e42}.hide{display:none!important}.categorygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cat{background:#f8fafd;border:1px solid var(--line);border-radius:12px;padding:20px}.cat strong{display:block;margin-top:10px}.cat span{color:var(--muted);font-size:13px}.foot{color:var(--muted);font-size:12px;margin-top:30px}.toast{position:fixed;right:22px;bottom:22px;background:#18335f;color:white;padding:14px 20px;border-radius:11px;box-shadow:0 10px 30px #0003;z-index:10}.dark{--bg:#111827;--surface:#1c2839;--ink:#e7edf8;--muted:#a7b2c7;--line:#334155}.dark input,.dark select,.dark textarea{background:#172233;color:var(--ink);border-color:#44536b}.dark .cat{background:#202f42}.dark .donut:after{background:var(--surface)}.dark .btn.secondary{background:#2d405b;color:#e1eaff}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.side{width:190px}.main{padding:22px}}@media(max-width:680px){.app{display:block}.side{position:static;width:100%;height:auto;padding:12px}.brand{padding:4px 8px 10px;font-size:18px}.menu{display:flex;overflow:auto;gap:4px}.nav{white-space:nowrap;width:auto;padding:9px}.main{padding:17px}.cards{grid-template-columns:1fr 1fr;gap:9px}.card{padding:15px}.card .value{font-size:20px}.grid,.formgrid{grid-template-columns:1fr}.categorygrid{grid-template-columns:1fr 1fr}h1{font-size:23px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">◈ Personal <span>Expense</span><br>Tracker</div><div class="menu" id="menu"><button class="nav active" data-page="dashboard">▦ Dashboard</button><button class="nav" data-page="add">＋ Add Expense</button><button class="nav" data-page="transactions">☷ Transactions</button><button class="nav" data-page="categories">▤ Categories</button><button class="nav" data-page="budget">◉ Budget</button><button class="nav" data-page="reports">▥ Reports</button><button class="nav" data-page="settings">⚙ Settings</button></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><p class="sub" id="subtitle">Your spending, clearly organized.</p></div><button class="btn" id="quickAdd">＋ Add Expense</button></div><div id="content"></div><div class="foot">Personal Expense Tracker · College mini-project · Data stored locally on this browser</div></main></div><div id="toast" class="toast hide"></div><script>
const cats=['Food','Travel','Shopping','Education','Entertainment','Bills','Others'];const colors=['#12ae85','#3166da','#8e63d6','#f3a42b','#df5a87','#25a7b9','#8291a8'];const icons=['🍔','🚗','🛍️','📚','🎬','💡','📦'];const $=s=>document.querySelector(s);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});const month=()=>new Date().toISOString().slice(0,7);let page='dashboard',selectedMonth=month(),editing=null;let expenses=JSON.parse(localStorage.getItem('pet_expenses')||'[]');let budgets=JSON.parse(localStorage.getItem('pet_budgets')||'{}');let dark=localStorage.getItem('pet_dark')==='true';document.body.classList.toggle('dark',dark);const save=()=>{localStorage.setItem('pet_expenses',JSON.stringify(expenses));localStorage.setItem('pet_budgets',JSON.stringify(budgets))};const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tx=()=>expenses.filter(x=>x.date.slice(0,7)===selectedMonth);const total=a=>a.reduce((s,x)=>s+Number(x.amount),0);const budget=()=>Number(budgets[selectedMonth]||0);const bycat=()=>cats.map((c,i)=>({name:c,color:colors[i],icon:icons[i],amount:total(tx().filter(x=>x.category===c))}));function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),2700)}function goto(p){page=p;editing=null;render()}function monthSelect(){return `<input aria-label="Select month" type="month" id="monthPick" value="${selectedMonth}">`}function stats(){const t=total(tx()),b=budget();return `<div class="cards"><div class="card"><div class="label">Monthly Budget</div><div class="value">${money(b)}</div></div><div class="card"><div class="label">Total Expenses</div><div class="value">${money(t)}</div></div><div class="card"><div class="label">Remaining Budget</div><div class="value">${money(b-t)}</div></div><div class="card"><div class="label">Transactions</div><div class="value">${tx().length}</div></div></div>`}function budgetBlock(){const t=total(tx()),b=budget(),pct=b?t/b*100:0;return `<div class="panel"><h2>Budget Usage</h2><div style="display:flex;justify-content:space-between;margin-bottom:13px"><span>${money(t)} spent</span><strong>${b?Math.round(pct)+'%':'No budget set'}</strong></div><div class="progress"><div style="width:${Math.min(pct,100)}%;background:${pct>100?'var(--red)':pct>=80?'#efa72f':'var(--green)'}"></div></div><p>${money(Math.max(b-t,0))} remaining of ${money(b)}</p>${b&&pct>=100?'<div class="notice danger">Your spending has reached or exceeded your monthly budget.</div>':b&&pct>=80?'<div class="notice warn">You have used at least 80% of your monthly budget.</div>':''}</div>`}function chart(){const a=bycat().filter(x=>x.amount>0),sum=total(tx());let pos=0;const stops=a.map(x=>{const start=pos;pos+=x.amount/sum*100;return `${x.color} ${start}% ${pos}%`});return `<div class="panel"><h2>Category Breakdown</h2>${sum?`<div class="chartarea"><div class="donut" style="background:conic-gradient(${stops.join(',')})"></div><div class="legend">${a.map(x=>`<div class="legendrow"><span><i class="dot" style="background:${x.color}"></i>${x.name}</span><strong>${money(x.amount)}</strong></div>`).join('')}</div></div>`:'<div class="empty">Add expenses to see your category chart.</div>'}</div>`}function table(items){return items.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Expense</th><th>Category</th><th>Amount</th><th>Actions</th></tr></thead><tbody>${items.map(x=>`<tr><td>${escapeHTML(x.date)}</td><td><strong>${escapeHTML(x.name)}</strong>${x.description?`<div class="sub">${escapeHTML(x.description)}</div>`:''}</td><td><span class="pill">${escapeHTML(x.category)}</span></td><td><strong>${money(x.amount)}</strong></td><td><div class="actions"><button class="btn secondary mini" data-edit="${x.id}">Edit</button><button class="btn danger mini" data-delete="${x.id}">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No expenses found. Add your first transaction!</div>'}function recent(){return `<div class="panel"><h2>Recent Transactions</h2>${table([...tx()].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}</div>`}function dashboard(){return `<div class="toolbar">${monthSelect()}<button class="btn secondary" data-go="budget">Set Budget</button></div>${stats()}<div class="grid">${chart()}${budgetBlock()}<div class="wide">${recent()}</div></div>`}function form(){const x=editing?expenses.find(y=>y.id===editing):null;return `<div class="panel" style="max-width:780px"><h2>${x?'Edit Expense':'Add New Expense'}</h2><form id="expenseForm"><div class="formgrid"><div class="field"><label>Expense Name</label><input name="name" maxlength="80" required placeholder="e.g. Textbooks" value="${escapeHTML(x?.name||'')}"></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0.00" value="${x?.amount||''}"></div><div class="field"><label>Category</label><select name="category">${cats.map(c=>`<option ${x?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Date</label><input name="date" type="date" required value="${x?.date||new Date().toLocaleDateString('en-CA')}"></div></div><div class="field" style="margin-top:16px"><label>Description (optional)</label><textarea name="description" rows="3" placeholder="Additional notes">${escapeHTML(x?.description||'')}</textarea></div><div class="formactions"><button class="btn" type="submit">${x?'Save Changes':'Save Expense'}</button><button type="button" class="btn secondary" data-go="transactions">Cancel</button></div></form></div>`}function transactions(){return `<div class="panel"><div class="toolbar">${monthSelect()}<input id="search" placeholder="Search expenses..." aria-label="Search expenses"><select id="catFilter"><option value="">All Categories</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="high">Highest amount</option><option value="low">Lowest amount</option></select></div><div id="txTable"></div></div>`}function categories(){return `<div class="toolbar">${monthSelect()}</div><div class="categorygrid">${bycat().map(x=>`<div class="cat"><div style="font-size:28px">${x.icon}</div><strong>${x.name}</strong><div style="font-size:23px;font-weight:800;margin:10px 0">${money(x.amount)}</div><span>${total(tx())?Math.round(x.amount/total(tx())*100):0}% of monthly spending</span></div>`).join('')}</div>`}function budgetPage(){return `<div class="toolbar">${monthSelect()}</div><div class="grid"><div class="panel"><h2>Set Monthly Budget</h2><form id="budgetForm"><div class="field"><label>Budget for ${selectedMonth}</label><input type="number" name="budget" min="0" step="0.01" required value="${budget()}"></div><button class="btn">Save Budget</button></form></div>${budgetBlock()}</div>`}function reports(){const a=bycat(),max=Math.max(...a.map(x=>x.amount),1);const months=Array.from({length:6},(_,i)=>{let d=new Date(selectedMonth+'-01T12:00:00');d.setMonth(d.getMonth()-5+i);let m=d.toISOString().slice(0,7);return {month:m,amount:total(expenses.filter(x=>x.date.slice(0,7)===m))}});const mmax=Math.max(...months.map(x=>x.amount),1);return `<div class="toolbar">${monthSelect()}<button class="btn secondary" id="exportCSV">↓ Export CSV</button></div>${stats()}<div class="grid"><div class="panel"><h2>Category Spending</h2>${a.map(x=>`<div class="barrow"><span>${x.name}</span><div class="barbg"><div class="barfill" style="width:${x.amount/max*100}%;background:${x.color}"></div></div><strong>${money(x.amount)}</strong></div>`).join('')}</div><div class="panel"><h2>Last 6 Months</h2>${months.map(x=>`<div class="barrow"><span>${x.month}</span><div class="barbg"><div class="barfill" style="width:${x.amount/mmax*100}%;background:var(--blue)"></div></div><strong>${money(x.amount)}</strong></div>`).join('')}</div></div>`}function settings(){return `<div class="panel" style="max-width:750px"><h2>Settings & Data</h2><div class="toolbar"><button class="btn secondary" id="theme">${dark?'☀ Light Mode':'☾ Dark Mode'}</button><button class="btn secondary" id="exportJSON">↓ Backup Data</button><label class="btn secondary" style="cursor:pointer;margin:0">↑ Restore Data<input type="file" accept="application/json" id="importJSON" hidden></label></div><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h2>Demo Data</h2><p>Load sample transactions to explore the dashboard. This replaces existing expenses and budgets.</p><button class="btn secondary" id="demo">Load Demo Data</button><hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><h2>Clear All Data</h2><p>Delete all locally saved transactions and monthly budgets.</p><button class="btn danger" id="clear">Clear Everything</button></div>`}function render(){const titles={dashboard:'Dashboard',add:editing?'Edit Expense':'Add Expense',transactions:'All Transactions',categories:'Expense Categories',budget:'Budget Management',reports:'Reports & Analytics',settings:'Settings'};$('#title').textContent=titles[page];$('#subtitle').textContent=page==='dashboard'?'Your spending, clearly organized.':'Manage your personal finances with ease.';document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#content').innerHTML=({dashboard,add:form,transactions,categories,budget:budgetPage,reports,settings})[page]();if(page==='transactions')filterTable()}function filterTable(){let a=[...tx()];const q=($('#search')?.value||'').toLowerCase(),c=$('#catFilter')?.value||'',s=$('#sort')?.value||'new';a=a.filter(x=>(x.name+' '+x.description).toLowerCase().includes(q)&&(!c||x.category===c));a.sort((x,y)=>s==='high'?y.amount-x.amount:s==='low'?x.amount-y.amount:s==='old'?x.date.localeCompare(y.date):y.date.localeCompare(x.date));$('#txTable').innerHTML=table(a)}function download(filename,text,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function csv(){const rows=[['Date','Name','Category','Amount','Description'],...tx().map(x=>[x.date,x.name,x.category,x.amount,x.description||''])];download('expenses-'+selectedMonth+'.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function loadDemo(){const samples=[['Textbooks','Education',1500],['Grocery Store','Food',1200],['Petrol Refill','Travel',850],['Internet Bill','Bills',800],['Lunch','Food',450],['Stationery','Education',350],['Movie','Entertainment',300],['Shopping','Shopping',650],['Bus Pass','Travel',400],['Electricity','Bills',650],['Groceries','Food',550],['Notebook','Education',200],['Coffee','Food',120],['Mobile Recharge','Bills',300],['Snacks','Food',180],['Auto Fare','Travel',200],['Shoes','Shopping',600],['Cinema Snack','Entertainment',180],['Books','Education',350],['Breakfast','Food',150],['Parking','Travel',100],['Water Bill','Bills',250],['Printing','Education',120],['Miscellaneous','Others',350]];const base=new Date(selectedMonth+'-01T12:00:00');expenses=samples.map((x,i)=>{let d=new Date(base);d.setDate(1+i);return{id:crypto.randomUUID(),name:x[0],category:x[1],amount:x[2],date:d.toISOString().slice(0,10),description:''}});budgets={[selectedMonth]:15000};save();goto('dashboard');toast('Demo data loaded')}document.addEventListener('click',e=>{const b=e.target.closest('button,[data-go]');if(!b)return;if(b.dataset.page)goto(b.dataset.page);if(b.dataset.go)goto(b.dataset.go);if(b.id==='quickAdd')goto('add');if(b.dataset.edit){editing=b.dataset.edit;page='add';render()}if(b.dataset.delete&&confirm('Delete this expense?')){expenses=expenses.filter(x=>x.id!==b.dataset.delete);save();render();toast('Expense deleted')}if(b.id==='exportCSV')csv();if(b.id==='theme'){dark=!dark;document.body.classList.toggle('dark',dark);localStorage.setItem('pet_dark',dark);render()}if(b.id==='exportJSON')download('expense-tracker-backup.json',JSON.stringify({expenses,budgets},null,2),'application/json');if(b.id==='demo'&&confirm('Replace existing data with demo transactions?'))loadDemo();if(b.id==='clear'&&confirm('Permanently delete all expense data and budgets?')){expenses=[];budgets={};save();render();toast('All data cleared')}});document.addEventListener('change',async e=>{if(e.target.id==='monthPick'){selectedMonth=e.target.value;render()}if(e.target.id==='catFilter'||e.target.id==='sort')filterTable();if(e.target.id==='importJSON'){try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.expenses)||!obj.budgets||typeof obj.budgets!=='object')throw Error('Invalid backup');if(!confirm('Replace existing data with backup?'))return;expenses=obj.expenses.filter(x=>x&&typeof x.name==='string'&&cats.includes(x.category)&&Number.isFinite(Number(x.amount))&&Number(x.amount)>0&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)).map(x=>({...x,amount:Number(x.amount),description:String(x.description||''),id:String(x.id||crypto.randomUUID())}));budgets=obj.budgets;save();goto('dashboard');toast('Backup restored')}catch(err){alert('Invalid backup file')}}});document.addEventListener('input',e=>{if(e.target.id==='search')filterTable()});document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='expenseForm'){const f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isFinite(amount)||amount<=0)return alert('Enter a valid amount');const item={id:editing||crypto.randomUUID(),name:String(f.get('name')).trim(),amount,category:f.get('category'),date:f.get('date'),description:String(f.get('description')).trim()};if(!item.name||!item.date)return alert('Complete required fields');if(editing)expenses=expenses.map(x=>x.id===editing?item:x);else expenses.push(item);selectedMonth=item.date.slice(0,7);save();goto('transactions');toast(editing?'Expense updated':'Expense added')}if(e.target.id==='budgetForm'){const value=Number(new FormData(e.target).get('budget'));if(!Number.isFinite(value)||value<0)return alert('Enter a valid budget');budgets[selectedMonth]=value;save();render();toast('Budget saved')}});render();
</script></body></html>
